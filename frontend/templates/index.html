<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Agent - AI Chat Assistant</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            blue: '#007AFF',
                            darkblue: '#0051D5',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    backdropBlur: {
                        'xs': '2px',
                        'apple': '20px',
                        'heavy': '40px',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-900 font-sans overflow-hidden">

    <!-- ============================================
         Layer 1: Ambient Layer - Animated Light Orbs
         奥行きを生む光の背景層
         ============================================ -->
    <div id="ambient-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- ============================================
         Layer 2: HUD Layer - Floating Status Satellites
         ユーザーステータスが宙に浮く層
         ============================================ -->
    <div id="hud-layer">
        <!-- Satellite: MBTI (左上) -->
        <div class="satellite satellite-1">
            <span class="satellite-text">MBTI: ENFP-T</span>
        </div>

        <!-- Satellite: Status (右上) -->
        <div class="satellite satellite-2">
            <span class="satellite-text">STATUS: Crystal</span>
        </div>

        <!-- Satellite: Goal (左下) -->
        <div class="satellite satellite-3">
            <span class="satellite-text">GOAL: ¥1,000,000</span>
        </div>
    </div>

    <!-- ============================================
         Layer 3: App Layer - Main Chat Window (最前面)
         Apple Vision Pro風 空間UI
         ============================================ -->
    <div id="app-layer" class="relative z-[100] min-h-screen flex items-center justify-center p-6">

        <!-- Main Container - 透明ガラスコンテナ -->
        <div class="w-full max-w-5xl h-[95vh] flex flex-col">

            <!-- Header - Vision Pro風ヘッダー -->
            <header class="bg-white/5 backdrop-blur-apple border border-white/10 rounded-t-3xl px-8 py-5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-gradient-to-br from-blue-500/20 to-purple-600/20 backdrop-blur-sm rounded-2xl flex items-center justify-center border border-white/10">
                        <span class="text-3xl">🔮</span>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-white tracking-tight">
                            Crystal Agent
                        </h1>
                        <p class="text-sm text-white/50 font-medium">AI Personal Assistant</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="statusIndicator" class="flex items-center gap-2 px-4 py-2 bg-white/5 backdrop-blur-sm rounded-full border border-white/10">
                        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse shadow-lg shadow-green-400/50"></div>
                        <span class="text-xs font-semibold text-white/70">Online</span>
                    </div>
                </div>
            </header>

            <!-- Main Content Area - 透明スペース -->
            <div class="flex-1 bg-white/[0.03] backdrop-blur-heavy border-x border-white/10 flex flex-col overflow-hidden">

                <!-- Chat Messages Container -->
                <div id="chatContainer" class="flex-1 overflow-y-auto px-8 py-6 space-y-4 scroll-smooth">
                    <!-- Welcome Message -->
                    <div class="flex justify-center my-12">
                        <div class="bg-white/5 backdrop-blur-apple border border-white/10 rounded-2xl px-8 py-6 max-w-2xl text-center">
                            <div class="text-6xl mb-4">👋</div>
                            <h2 class="text-2xl font-bold text-white mb-2">Welcome to Crystal Agent</h2>
                            <p class="text-white/60 leading-relaxed">
                                あなたの日々の行動や思考を記録し、AIがサポートします。<br>
                                なんでも話しかけてください。
                            </p>
                        </div>
                    </div>

                    <!-- Messages will be inserted here dynamically -->
                </div>

                <!-- Stats Display - ガラスカード -->
                <div id="statsDisplay" class="px-8 py-4 border-t border-white/10">
                    <div class="grid grid-cols-3 gap-4">
                        <!-- Stat Card 1 -->
                        <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3 hover:bg-white/10 transition-all duration-300 hover:scale-105">
                            <div class="text-white/50 text-xs font-semibold uppercase tracking-wider mb-1">Total</div>
                            <div id="totalCount" class="text-2xl font-bold text-white">0</div>
                        </div>
                        <!-- Stat Card 2 -->
                        <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3 hover:bg-white/10 transition-all duration-300 hover:scale-105">
                            <div class="text-white/50 text-xs font-semibold uppercase tracking-wider mb-1">Diary</div>
                            <div id="diaryCount" class="text-2xl font-bold text-white">0</div>
                        </div>
                        <!-- Stat Card 3 -->
                        <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3 hover:bg-white/10 transition-all duration-300 hover:scale-105">
                            <div class="text-white/50 text-xs font-semibold uppercase tracking-wider mb-1">Tasks</div>
                            <div id="taskCount" class="text-2xl font-bold text-white">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area - Vision Pro風フッター -->
            <footer class="bg-white/5 backdrop-blur-apple border border-white/10 rounded-b-3xl px-8 py-6">
                <!-- Quick Actions - ガラスボタン -->
                <div class="mb-4 flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                    <button onclick="quickInput('今日のランチは800円でした')"
                            class="quick-action-btn bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-300 hover:scale-105">
                        💰 支出を記録
                    </button>
                    <button onclick="quickInput('今日やることリスト')"
                            class="quick-action-btn bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-300 hover:scale-105">
                        📝 タスク追加
                    </button>
                    <button onclick="quickInput('今日の振り返り')"
                            class="quick-action-btn bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-300 hover:scale-105">
                        ✨ 日記を書く
                    </button>
                    <button onclick="quickInput('ステータス')"
                            class="quick-action-btn bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-300 hover:scale-105">
                        🔮 ステータス確認
                    </button>
                </div>

                <!-- Input Box - ガラス入力欄 -->
                <div class="flex gap-3">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="メッセージを入力..."
                        class="flex-1 bg-white/5 backdrop-blur-sm border border-white/20 text-white placeholder-white/40 rounded-2xl px-6 py-4 focus:outline-none focus:ring-2 focus:ring-apple-blue/50 focus:border-apple-blue/50 transition-all duration-300"
                        onkeypress="if(event.key === 'Enter') sendMessage()"
                    >
                    <button
                        onclick="sendMessage()"
                        id="sendButton"
                        class="bg-gradient-to-r from-apple-blue to-blue-600 hover:from-blue-600 hover:to-apple-blue text-white px-8 py-4 rounded-2xl font-semibold transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-apple-blue/30">
                        送信
                    </button>
                </div>
            </footer>

        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="/static/js/script.js"></script>

</body>
</html>
