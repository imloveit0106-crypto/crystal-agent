<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Agent - AI Personal Assistant</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    letterSpacing: {
                        'tighter': '-0.02em',
                    }
                }
            }
        }
    </script>

    <!-- Minimal Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-white font-sans antialiased text-gray-900">

    <!-- Main Container -->
    <div class="min-h-screen flex flex-col">

        <!-- Header -->
        <header class="bg-white border-b border-gray-100 px-6 py-5 sticky top-0 z-50">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <!-- Title -->
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-gray-900">
                        Crystal Agent
                    </h1>
                    <p class="text-xs text-gray-500 font-medium hidden sm:block">AI Personal Assistant</p>
                </div>

                <!-- Status -->
                <div id="statusIndicator" class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 rounded-full">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-xs font-medium text-gray-600 hidden sm:inline">Online</span>
                </div>
            </div>
        </header>

        <!-- Artwork Area (Notion Style) -->
        <div class="bg-white border-b border-gray-100 py-8">
            <div class="max-w-3xl mx-auto text-center">
                <img id="heroArtwork"
                     src=""
                     alt="Illustration"
                     class="mx-auto h-32 opacity-60 grayscale"
                     style="filter: grayscale(100%);">
            </div>
        </div>

        <!-- Chat Container -->
        <main class="flex-1 overflow-hidden flex flex-col bg-white">

            <!-- Messages Area -->
            <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-8">
                <div class="max-w-3xl mx-auto space-y-6">
                    <!-- Messages will be inserted here -->
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="border-t border-gray-100 bg-white px-4 py-4">
                <div class="max-w-3xl mx-auto">
                    <div class="grid grid-cols-3 gap-4">
                        <!-- Total -->
                        <div class="text-center py-3">
                            <div class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Total</div>
                            <div id="totalCount" class="text-2xl font-bold text-gray-900">0</div>
                        </div>
                        <!-- Diary -->
                        <div class="text-center py-3">
                            <div class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Diary</div>
                            <div id="diaryCount" class="text-2xl font-bold text-gray-900">0</div>
                        </div>
                        <!-- Tasks -->
                        <div class="text-center py-3">
                            <div class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Tasks</div>
                            <div id="taskCount" class="text-2xl font-bold text-gray-900">0</div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer / Input Area -->
        <footer class="bg-white border-t border-gray-100 px-4 py-6 sticky bottom-0">
            <div class="max-w-3xl mx-auto">

                <!-- Quick Actions -->
                <div class="mb-4 flex gap-2 overflow-x-auto pb-2">
                    <button onclick="quickInput('今日のランチは800円でした')"
                            class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 rounded-lg whitespace-nowrap transition-colors duration-200">
                        支出を記録
                    </button>
                    <button onclick="quickInput('今日やることリスト')"
                            class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 rounded-lg whitespace-nowrap transition-colors duration-200">
                        タスク追加
                    </button>
                    <button onclick="quickInput('今日の振り返り')"
                            class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 rounded-lg whitespace-nowrap transition-colors duration-200">
                        日記を書く
                    </button>
                    <button onclick="quickInput('ステータス')"
                            class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 rounded-lg whitespace-nowrap transition-colors duration-200">
                        ステータス
                    </button>
                </div>

                <!-- Input Box -->
                <div class="flex gap-3">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="メッセージを入力..."
                        class="flex-1 bg-gray-100 border-0 text-gray-900 placeholder-gray-500 rounded-xl px-5 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow duration-200 text-base"
                        onkeypress="if(event.key === 'Enter') sendMessage()"
                    >
                    <button
                        onclick="sendMessage()"
                        id="sendButton"
                        class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-3.5 rounded-xl font-semibold transition-colors duration-200 text-base flex items-center gap-2">
                        <span>送信</span>
                        <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </button>
                </div>

            </div>
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="/static/js/script.js"></script>

    <!-- Initialize Lucide Icons & Artwork -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Random Artwork Selection (Notion Style)
        const artworks = [
            'https://i.imgur.com/Pl5KbPL.png',  // 読書しながら箱に座る
            'https://i.imgur.com/1nxuEnz.png',  // 時計とヘッドフォン
            'https://i.imgur.com/Pl5KbPL.png',  // 椅子に座ってコーヒー
            'https://i.imgur.com/wODM5z4.png'   // コーヒーカップと人
        ];

        const randomArtwork = artworks[Math.floor(Math.random() * artworks.length)];
        document.getElementById('heroArtwork').src = randomArtwork;
    </script>

</body>
</html>
