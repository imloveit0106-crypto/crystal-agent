<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <div class="header-title">Crystal Agent</div>
            <div class="header-subtitle">PERSONAL KNOWLEDGE BASE</div>
        </header>

        <div class="main-content">
            <main class="chat-container">

                <div id="chat-history" class="chat-messages">
                    <div class="message agent-message">
                        <div class="message-header">
                            <span class="message-author">CRYSTAL</span>
                        </div>
                        <div class="message-text">
                            <p>準備が整いました。思考の整理を始めましょう。</p>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <form id="chat-form" class="chat-input-form">
                        <input type="text" id="user-input" class="chat-input" placeholder="Type to think..." autocomplete="off">
                        <button type="submit" class="send-button">
                            <i data-lucide="arrow-up"></i>
                        </button>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
