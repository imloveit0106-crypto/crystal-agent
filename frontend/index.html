<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Agent - AI Chat Assistant</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            blue: '#007AFF',
                            darkblue: '#0051D5',
                            lightblue: '#E3F2FD',
                            gray: '#F5F5F7',
                            darkgray: '#1D1D1F',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'apple': '0 4px 16px rgba(0, 0, 0, 0.08)',
                        'apple-lg': '0 8px 32px rgba(0, 0, 0, 0.12)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Apple Quality Custom Styles */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
        }

        /* メッセージアニメーション */
        .message-enter {
            animation: messageSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* タイピングインジケーター */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #6B7280;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        /* Frosted Glass Effect */
        .glass {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.95);
        }

        /* Scrollbar - Apple Style */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* メッセージ吹き出しのテール */
        .message-tail-user::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid #007AFF;
            border-bottom: 8px solid transparent;
        }

        .message-tail-ai::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -8px;
            width: 0;
            height: 0;
            border-right: 8px solid white;
            border-bottom: 8px solid transparent;
        }

        /* 送信ボタンのパルス効果 */
        @keyframes pulse-blue {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 122, 255, 0);
            }
        }

        .btn-send:hover {
            animation: pulse-blue 2s infinite;
        }
    </style>
</head>
<body class="font-sans">

    <!-- Main Container - Glassmorphism Card -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-4xl h-[90vh] glass rounded-3xl shadow-apple-lg overflow-hidden flex flex-col">

            <!-- Header - Elegant & Minimal -->
            <header class="bg-gradient-to-r from-white/90 to-white/80 backdrop-blur-md border-b border-white/20 px-8 py-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                            <span class="text-2xl">🔮</span>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold bg-gradient-to-r from-apple-blue to-purple-600 bg-clip-text text-transparent">
                                Crystal Agent
                            </h1>
                            <p class="text-sm text-gray-500 font-medium">Your AI Assistant</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div id="statusIndicator" class="flex items-center gap-2 px-4 py-2 bg-green-50 rounded-full">
                            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span class="text-xs font-semibold text-green-700">Online</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Stats Bar - Clean & Modern -->
            <div class="bg-gradient-to-r from-gray-50 to-white px-8 py-4 border-b border-gray-100">
                <div class="grid grid-cols-3 gap-6">
                    <div class="text-center group hover:scale-105 transition-transform cursor-pointer">
                        <div class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-blue-400 bg-clip-text text-transparent" id="statTotal">0</div>
                        <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mt-1">Records</div>
                    </div>
                    <div class="text-center group hover:scale-105 transition-transform cursor-pointer">
                        <div class="text-3xl font-bold bg-gradient-to-r from-green-600 to-emerald-400 bg-clip-text text-transparent" id="statAmount">¥0</div>
                        <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mt-1">Expenses</div>
                    </div>
                    <div class="text-center group hover:scale-105 transition-transform cursor-pointer">
                        <div class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-pink-400 bg-clip-text text-transparent" id="statTypes">0</div>
                        <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mt-1">Categories</div>
                    </div>
                </div>
            </div>

            <!-- Chat Messages - iMessage Style -->
            <div id="chatMessages" class="flex-1 overflow-y-auto px-8 py-6 space-y-4 bg-gradient-to-b from-gray-50/50 to-white/50">
                <!-- Welcome Message -->
                <div class="flex gap-3 items-end message-enter">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white shadow-lg flex-shrink-0">
                        <span class="text-xl">🤖</span>
                    </div>
                    <div class="flex flex-col max-w-md">
                        <div class="relative bg-white message-tail-ai rounded-3xl rounded-bl-md px-6 py-4 shadow-apple">
                            <p class="text-gray-800 leading-relaxed">
                                こんにちは！今日はどんなことがありましたか？✨
                            </p>
                        </div>
                        <span class="text-xs text-gray-400 mt-2 ml-2">Crystal Agent • たった今</span>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator (hidden by default) -->
            <div id="typingIndicator" class="hidden px-8 pb-2">
                <div class="flex gap-3 items-end">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white shadow-lg flex-shrink-0">
                        <span class="text-xl">🤖</span>
                    </div>
                    <div class="bg-white rounded-3xl rounded-bl-md px-6 py-4 shadow-apple">
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area - Fixed Bottom -->
            <div class="bg-white border-t border-gray-100 px-8 py-6">
                <form id="chatForm" class="flex gap-3 items-center">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="メッセージを入力..."
                        class="flex-1 px-6 py-4 bg-gray-50 border-2 border-gray-100 rounded-full text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-base"
                        autocomplete="off"
                    />
                    <button
                        type="submit"
                        class="btn-send px-8 py-4 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold rounded-full transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1 active:translate-y-0 flex items-center gap-2"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                        送信
                    </button>
                </form>

                <!-- Quick Actions -->
                <div class="flex flex-wrap gap-2 mt-4">
                    <button onclick="quickInput('今日のランチに1000円使った')" class="px-4 py-2 bg-gradient-to-r from-green-50 to-emerald-50 hover:from-green-100 hover:to-emerald-100 text-green-700 text-sm font-semibold rounded-full border border-green-200 transition-all hover:scale-105">
                        💰 支出を記録
                    </button>
                    <button onclick="quickInput('今日は良い天気だった')" class="px-4 py-2 bg-gradient-to-r from-blue-50 to-sky-50 hover:from-blue-100 hover:to-sky-100 text-blue-700 text-sm font-semibold rounded-full border border-blue-200 transition-all hover:scale-105">
                        📔 日記を書く
                    </button>
                    <button onclick="quickInput('明日までに資料を完成させる')" class="px-4 py-2 bg-gradient-to-r from-purple-50 to-pink-50 hover:from-purple-100 hover:to-pink-100 text-purple-700 text-sm font-semibold rounded-full border border-purple-200 transition-all hover:scale-105">
                        ✅ タスクを追加
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // 初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadStats();
            await checkConnection();
        });

        // 接続チェック
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                const data = await response.json();

                const statusIndicator = document.getElementById('statusIndicator');
                if (data.notion === 'connected' && data.gemini === 'connected') {
                    statusIndicator.innerHTML = `
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-semibold text-green-700">Online</span>
                    `;
                    statusIndicator.className = 'flex items-center gap-2 px-4 py-2 bg-green-50 rounded-full';
                } else {
                    statusIndicator.innerHTML = `
                        <div class="w-2 h-2 bg-yellow-500 rounded-full"></div>
                        <span class="text-xs font-semibold text-yellow-700">Limited</span>
                    `;
                    statusIndicator.className = 'flex items-center gap-2 px-4 py-2 bg-yellow-50 rounded-full';
                }
            } catch (error) {
                console.error('Connection check failed:', error);
                const statusIndicator = document.getElementById('statusIndicator');
                statusIndicator.innerHTML = `
                    <div class="w-2 h-2 bg-red-500 rounded-full"></div>
                    <span class="text-xs font-semibold text-red-700">Offline</span>
                `;
                statusIndicator.className = 'flex items-center gap-2 px-4 py-2 bg-red-50 rounded-full';
            }
        }

        // 統計データ読み込み
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/stats`);
                const stats = await response.json();

                // アニメーション付きで数値を更新
                animateNumber('statTotal', stats.total);

                const totalAmount = stats.amounts.reduce((sum, amt) => sum + amt, 0);
                animateNumber('statAmount', totalAmount, '¥');

                animateNumber('statTypes', Object.keys(stats.types).length);

                console.log('📊 統計データ取得:', stats);
            } catch (error) {
                console.error('Stats load failed:', error);
            }
        }

        // 数値アニメーション
        function animateNumber(elementId, targetValue, prefix = '') {
            const element = document.getElementById(elementId);
            const duration = 1000;
            const steps = 30;
            const stepValue = targetValue / steps;
            let currentValue = 0;

            const timer = setInterval(() => {
                currentValue += stepValue;
                if (currentValue >= targetValue) {
                    currentValue = targetValue;
                    clearInterval(timer);
                }
                element.textContent = prefix + Math.floor(currentValue).toLocaleString();
            }, duration / steps);
        }

        // フォーム送信
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // ユーザーメッセージを表示
            addMessage(message, 'user');

            // 入力欄をクリア
            input.value = '';

            // タイピングインジケーターを表示
            showTypingIndicator();

            try {
                // APIリクエスト
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        use_rag: true
                    })
                });

                const data = await response.json();

                console.log('💬 チャット応答:', data);
                console.log('🔍 RAG使用:', data.rag_used ? 'はい' : 'いいえ');

                // タイピングインジケーターを非表示
                hideTypingIndicator();

                // AIメッセージを表示
                addMessage(data.response, 'assistant', {
                    type: data.detected_type,
                    amount: data.detected_amount,
                    saved: data.saved_to_notion
                });

                // 統計を更新
                await loadStats();

            } catch (error) {
                console.error('Chat error:', error);
                hideTypingIndicator();
                addMessage('申し訳ございません。接続エラーが発生しました。', 'assistant');
            }
        });

        // タイピングインジケーター表示
        function showTypingIndicator() {
            document.getElementById('typingIndicator').classList.remove('hidden');
            scrollToBottom();
        }

        // タイピングインジケーター非表示
        function hideTypingIndicator() {
            document.getElementById('typingIndicator').classList.add('hidden');
        }

        // メッセージ追加
        function addMessage(text, role, meta = {}) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-enter';

            const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            if (role === 'user') {
                messageDiv.innerHTML = `
                    <div class="flex gap-3 items-end justify-end">
                        <div class="flex flex-col items-end max-w-md">
                            <div class="relative bg-gradient-to-r from-blue-500 to-blue-600 message-tail-user rounded-3xl rounded-br-md px-6 py-4 shadow-lg">
                                <p class="text-white leading-relaxed">${escapeHtml(text)}</p>
                            </div>
                            <span class="text-xs text-gray-400 mt-2 mr-2">あなた • ${now}</span>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center shadow-lg flex-shrink-0">
                            <span class="text-xl">👤</span>
                        </div>
                    </div>
                `;
            } else {
                const metaInfo = meta.saved ? `
                    <div class="flex gap-2 mt-3">
                        <span class="px-3 py-1 bg-green-100 text-green-700 text-xs rounded-full font-semibold">✓ ${meta.type}</span>
                        ${meta.amount ? `<span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs rounded-full font-semibold">¥${meta.amount.toLocaleString()}</span>` : ''}
                    </div>
                ` : '';

                messageDiv.innerHTML = `
                    <div class="flex gap-3 items-end">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white shadow-lg flex-shrink-0">
                            <span class="text-xl">🤖</span>
                        </div>
                        <div class="flex flex-col max-w-md">
                            <div class="relative bg-white message-tail-ai rounded-3xl rounded-bl-md px-6 py-4 shadow-apple">
                                <p class="text-gray-800 leading-relaxed">${escapeHtml(text)}</p>
                                ${metaInfo}
                            </div>
                            <span class="text-xs text-gray-400 mt-2 ml-2">Crystal Agent • ${now}</span>
                        </div>
                    </div>
                `;
            }

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // 下までスクロール
        function scrollToBottom() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTo({
                top: messagesContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // クイック入力
        function quickInput(text) {
            document.getElementById('messageInput').value = text;
            document.getElementById('messageInput').focus();
        }

        // HTML エスケープ
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

</body>
</html>
