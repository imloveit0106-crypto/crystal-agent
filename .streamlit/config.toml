# Streamlit 設定ファイル
# 高級感のあるクリーム色 × Times New Roman テーマ

[theme]
primaryColor = "#000000"
backgroundColor = "#FFFEF5"
secondaryBackgroundColor = "#FFF9E6"
textColor = "#000000"
font = "serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
